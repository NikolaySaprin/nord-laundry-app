name: Debug SSH

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Show host and user
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          echo "VPS_HOST length: ${#HOST}"
          echo "VPS_HOST (masked but visible structure): ${HOST:0:3}.***.***.${HOST: -3}"
          echo "VPS_USER length: ${#USER}"
          echo "VPS_USER first/last chars: ${USER:0:1}***${USER: -1}"

      - name: Derive public key from VPS_SSH_KEY
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$SSH_KEY" > ~/.ssh/id_deploy
          # Гарантируем перевод строки в конце
          [ -z "$(tail -c1 ~/.ssh/id_deploy)" ] || echo "" >> ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "--- First/last lines of decoded key ---"
          head -1 ~/.ssh/id_deploy
          tail -1 ~/.ssh/id_deploy
          wc -l ~/.ssh/id_deploy
          echo ""
          echo "--- Public key derived from secret (compare to your local beget_deploy.pub!) ---"
          ssh-keygen -y -f ~/.ssh/id_deploy
          echo ""
          echo "--- Fingerprint ---"
          ssh-keygen -lf ~/.ssh/id_deploy

      - name: Try SSH with verbose output
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -vvv \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o BatchMode=yes \
              -o ConnectTimeout=10 \
              -i ~/.ssh/id_deploy \
              "$USER@$HOST" \
              'echo "OK: $(whoami)@$(hostname)"' 2>&1 | tail -80 || echo "SSH failed"
