name: Deploy to VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e

            echo "==> Sync source in /srv/nord/web"
            cd /srv/nord/web

            if [ ! -d .git ]; then
              echo "==> First-time git init in working directory"
              git init -q
              git remote add origin https://github.com/NikolaySaprin/nord-cleaning.git
            fi

            git fetch origin main
            git reset --hard origin/main

            echo "==> Install dependencies (npm ci)"
            npm ci

            echo "==> Build Next.js (.next is mounted into web container)"
            npm run build

            echo "==> Rebuild and recreate web container"
            cd /srv/nord
            docker compose build web
            docker compose up -d --force-recreate web

            echo "==> Done. Web container status:"
            docker compose ps web
