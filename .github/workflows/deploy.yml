name: Deploy to VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          debug: true
          script: |
            # Обновляем код веб-приложения
            cd /srv/nord/web
            git fetch --all
            git reset --hard origin/main
            
            # Обновляем код бота (если репозиторий отдельный)
            # cd /srv/nord/bot
            # git fetch --all
            # git reset --hard origin/main
            
            # Пересобираем и перезапускаем контейнеры
            cd /srv/nord
            docker compose build web
            docker compose up -d --force-recreate web
            
            # Проверяем статус
            docker compose ps
